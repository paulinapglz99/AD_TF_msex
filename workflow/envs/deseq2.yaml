channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base=4.4.3
  - bioconductor-deseq2=1.46.0
  - bioconductor-org.hs.eg.db=3.20.0 # offline gene annotation (symbol, chromosome)
  - bioconductor-limma=3.62.1 # removeBatchEffect (sample and network QC)
  - bioconductor-edaseq=2.40.0 # GC and length correction (rule gc_normalize)
  - bioconductor-noiseq=2.50.0 # diagnostics of the GC and length biases
  - r-dplyr=1.2.1
  - r-tidyr=1.3.2
  - r-readr=2.2.0
