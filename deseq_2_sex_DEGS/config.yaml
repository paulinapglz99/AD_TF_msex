# ==============================================================================
# Configuration file for Sex-Stratified DESeq2 Analysis
# ==============================================================================

# Brain areas to analyze
brain_areas:
  - DLPFC
  - hippocampus
  - cortex

# Input directories
counts_dir: "data/counts"
metadata_dir: "data/metadata"

# Output directory
outdir: "results"

# Statistical thresholds
padj_threshold: 0.05
lfc_threshold: 0.5

# Computational resources
cores: 4

# Metadata column names (if different from defaults)
# metadata_columns:
#   sample_id: "specimenID"
#   sex: "sex"
#   diagnosis: "diagnosis"
#   source: "specimenIdSource"
#   pmi: "pmi"
#   rin: "RIN"

# Optional: Minimum counts filter
# min_counts: 10
# min_samples: 3

# Optional: Covariates to include in the model
# covariates:
#   - specimenIdSource
#   - pmi
#   - RIN
#   - age
#   - batch